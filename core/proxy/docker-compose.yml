version: "3.9"

services:
  proxy:
    image: caddy:2.8
    container_name: ${DCN_CORE_PROXY}
    restart: unless-stopped

    # ------------------------------------------------------------
    # Ports
    # ------------------------------------------------------------
    # Proxy — это ЕДИНСТВЕННАЯ точка входа для HTTP/HTTPS
    # во всю core-инфраструктуру.
    #
    # Мы публикуем ТОЛЬКО порт 80 (позже добавится 443).
    # Все остальные сервисы (gitea, registry и т.д.)
    # будут доступны только ВНУТРИ Docker-сети net-core.
    ports:
      - "80:80"
      - "443:443"

    # ------------------------------------------------------------
    # Environment
    # ------------------------------------------------------------
    # GITEA_DOMAIN передаётся в Caddy как переменная окружения.
    #
    # В Caddyfile мы используем {$GITEA_DOMAIN},
    # чтобы связать доменное имя и маршрут проксирования.
    #
    # Это позволяет:
    # - не хардкодить домены в конфигурации proxy
    # - управлять доменами централизованно через .env.core
    # - легко добавлять новые сервисы (ci, registry и т.д.)
    environment:
      GITEA_DOMAIN: ${GITEA_DOMAIN}

    # ------------------------------------------------------------
    # Volumes
    # ------------------------------------------------------------
    # 1) Caddyfile монтируется как read-only конфигурация.
    #
    #    Это часть IaC:
    #    - конфиг хранится в git
    #    - контейнер не может его изменить
    #    - любое изменение требует явного коммита и перезапуска
    #
    # 2) caddy_data и caddy_config — именованные volumes.
    #
    #    Почему это важно:
    #    - Caddy хранит там runtime-данные
    #      (сертификаты, state, cache)
    #    - данные НЕ теряются при пересоздании контейнера
    #    - volumes легко бэкапить и переносить
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    # ------------------------------------------------------------
    # Networks
    # ------------------------------------------------------------
    # Proxy подключается к net-core, чтобы:
    # - видеть все core-сервисы (gitea, registry, ci)
    # - проксировать к ним по имени сервиса (gitea:3000)
    # - не использовать IP-адреса контейнеров
    #
    # net-core — общая core-сеть, управляемая извне (core.up.sh).
    networks:
      - net-core

# ------------------------------------------------------------
# Volumes (top-level)
# ------------------------------------------------------------
# Мы объявляем volumes явно и задаём имена вручную.
#
# Почему это важно:
# - Docker не генерирует project-based имена
# - volumes становятся независимыми от compose-файла
# - упрощается миграция и бэкапы
#
# caddy_data   — runtime данные Caddy (state, сертификаты)
# caddy_config — внутренняя конфигурация Caddy
volumes:
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config

# ------------------------------------------------------------
# Networks (top-level)
# ------------------------------------------------------------
# net-core объявлена как external, потому что:
# - сеть создаётся централизованно (core.up.sh)
# - используется несколькими compose-файлами
# - Docker Compose не должен управлять её жизненным циклом
#
# Поле name связывает compose-сеть с реальным именем
# Docker-сети через переменную CORE_NETWORK_NAME из .env.core.
networks:
  net-core:
    external: true
    name: ${CORE_NETWORK_NAME}
