services:
  gitea:
    image: gitea/gitea:1.22-rootless
    container_name: ${DCN_CORE_GITEA}
    restart: unless-stopped

    # ------------------------------------------------------------
    # Networks
    # ------------------------------------------------------------
    # Мы явно подключаем сервис к сети net-core.
    #
    # Почему это важно:
    # - net-core — это "core network", в которой живут все базовые сервисы
    #   (proxy, gitea, registry и т.д.).
    # - Сервисы внутри одной Docker-сети могут обращаться друг к другу
    #   по имени сервиса (например, proxy -> gitea:3000).
    # - Мы НЕ используем IP-адреса контейнеров, так как они не стабильны.
    #
    # Имя сети фиксировано на уровне compose (net-core),
    # а реальное имя сети задаётся через переменную CORE_NETWORK_NAME
    # в .env.core — это часть IaC-контракта.
    networks:
      - net-core

    # ------------------------------------------------------------
    # Volumes
    # ------------------------------------------------------------
    # Важно: данные Gitea НЕ хранятся в контейнере.
    # Мы используем именованные volumes с ЯВНЫМИ именами.
    #
    # Почему мы явно указываем имена volumes:
    # - Docker по умолчанию может генерировать имена автоматически
    #   (projectname_volume), что усложняет миграцию и бэкапы.
    # - Явное имя volume гарантирует:
    #   * предсказуемость
    #   * сохранность данных при пересоздании контейнера
    #   * простую миграцию на другой сервер
    #
    # gitea_data — репозитории, attachments, данные пользователей
    # gitea_config — конфигурация Gitea (app.ini и т.п.)
    volumes:
      - gitea_data:/var/lib/gitea
      - gitea_config:/etc/gitea

    environment:
      # Таймзона влияет на логи и время в UI
      - TZ=${TZ}

      # Эти параметры важны для правильных ссылок и git clone адресов.
      # ROOT_URL — "канонический" URL сервиса, который Gitea использует
      # при генерации ссылок в UI, webhook'ах и clone URL.
      - GITEA__server__DOMAIN=${GITEA_DOMAIN}
      - GITEA__server__ROOT_URL=${GITEA_ROOT_URL}

      # ------------------------------------------------------------
      # SSH configuration
      # ------------------------------------------------------------
      # SSH_DOMAIN логически совпадает с веб-доменом.
      # Мы используем домен, а не IP, чтобы:
      # - не менять clone URL при переходе на HTTPS
      # - иметь единый внешний идентификатор сервиса
      - GITEA__server__SSH_DOMAIN=${GITEA_DOMAIN}
      - GITEA__server__SSH_PORT=${GITEA_SSH_PORT}
      - GITEA__server__START_SSH_SERVER=true
      - GITEA__server__SSH_LISTEN_PORT=2222

      # Rootless-образ ожидает uid/gid пользователя.
      # Это гарантирует корректные права на volumes
      # и отсутствие permission issues на хосте.
      - USER_UID=${GITEA_USER_UID}
      - USER_GID=${GITEA_USER_GID}

    # Небольшая проверка, что HTTP реально отдаётся
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 10s
      timeout: 3s
      retries: 10

# ------------------------------------------------------------
# Volumes (top-level)
# ------------------------------------------------------------
# Мы объявляем volumes на верхнем уровне и явно задаём name.
#
# Почему это важно:
# - Имя volume становится глобальным и независимым от project name.
# - Контейнер можно удалить/пересоздать без риска потери данных.
# - Volume легко бэкапить, переносить и подключать вручную.
volumes:
  gitea_data:
    name: gitea_data
  gitea_config:
    name: gitea_config

# ------------------------------------------------------------
# Networks (top-level)
# ------------------------------------------------------------
# net-core объявлена как external, потому что:
# - сеть создаётся и управляется core.up.sh
# - она используется несколькими compose-файлами
# - Docker Compose не должен её пересоздавать или удалять
#
# Поле name позволяет задать реальное имя сети через переменную
# CORE_NETWORK_NAME из .env.core — это часть IaC-контракта.
networks:
  net-core:
    external: true
    name: ${CORE_NETWORK_NAME}
