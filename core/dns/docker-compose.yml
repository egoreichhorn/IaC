version: "3.9"

services:
  unbound:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${DCN_CORE_DNS}
    restart: unless-stopped

    # ------------------------------------------------------------
    # Ports
    # ------------------------------------------------------------
    # DNS — инфраструктурный сервис для локальной сети.
    #
    # Мы публикуем 53/tcp и 53/udp на хост,
    # чтобы устройства в LAN могли использовать этот DNS:
    # - mac/iphone/pc -> DNS_HOST_IP:53
    #
    # Важно:
    # - Это НЕ нужно контейнерам для резолва имён в Docker-сети.
    #   Контейнеры внутри net-core используют Docker DNS.
    # - Unbound нужен клиентам в LAN для резолва доменов вида:
    #   gitea.egor.lan -> 192.168.88.234 (host)
    ports:
      - "${DNS_HOST_PORT}:53/udp"
      - "${DNS_HOST_PORT}:53/tcp"

    # ------------------------------------------------------------
    # Volumes
    # ------------------------------------------------------------
    # Конфиг Unbound хранится в git и монтируется read-only.
    # Это IaC контракт: контейнер не может менять конфиг.
    volumes:
      - ./unbound.conf:/opt/unbound/etc/unbound/unbound.conf:ro

    # ------------------------------------------------------------
    # Networks
    # ------------------------------------------------------------
    # Подключаем DNS-контейнер к net-core:
    # - чтобы он был частью core-слоя (единая инфраструктура)
    # - в будущем (если понадобится) можно будет резолвить/логировать
    #   внутри общей сети
    networks:
      - net-core

networks:
  net-core:
    external: true
    name: ${CORE_NETWORK_NAME}